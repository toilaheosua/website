# Cấu hình reverse proxy cho dashboard, dùng khi bạn thêm subdomain panel.tenmien.com trong aaPanel.
# Cách dùng trong aaPanel: Website > Add site "panel.tenmien.com" (PHP static) > Reverse proxy
#   Target URL: http://127.0.0.1:3000  (hoặc dán nội dung location bên dưới vào Config)
# Sau đó bật SSL (Let's Encrypt) cho subdomain này và trỏ DNS panel -> IP server (không cần proxy Cloudflare).

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    client_max_body_size 20m;
}
